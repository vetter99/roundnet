<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roundnet</title>
    <!-- Bold sporty display font for game text (the dev panel keeps the system font). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2b1f; font-family: system-ui, sans-serif; }
      #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #hud { position: fixed; top: 12px; left: 16px; color: #fff; text-shadow: 0 1px 3px #000a; pointer-events: none; }
      /* Game text uses the sporty display font. */
      #hud .stats, #flash, #prompt, #sound { font-family: 'Russo One', system-ui, sans-serif; font-weight: 400; letter-spacing: 0.02em; }
      #hud .stats { font-size: 22px; }
      /* Dev stats panel */
      #hud .last { width: 340px; margin-top: 8px; padding: 12px 14px; border-radius: 10px;
                   background: rgba(12, 22, 14, 0.78); text-shadow: none;
                   font-size: 15px; line-height: 1.55; font-variant-numeric: tabular-nums; }
      #hud .section + .section, #hud .miss + .section { margin-top: 12px; }
      #hud .section h4 { margin: 0 0 4px; padding-bottom: 3px; border-bottom: 1px solid #ffffff26;
                         font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.65; }
      #hud .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      #hud .row .k { opacity: 0.8; }
      #hud .row .v { font-weight: 600; text-align: right; }
      #hud .row small { opacity: 0.7; font-size: 12px; }
      #hud .empty { opacity: 0.6; }
      #hud .panel { position: relative; width: max-content; }
      #hud .panel.hidden { display: none; }
      #closeStats { position: absolute; top: 14px; right: 6px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
                    background: #ffffff22; color: #fff; font-size: 16px; line-height: 22px; cursor: pointer; pointer-events: auto; }
      #closeStats:hover { background: #ffffff44; }
      #hud .miss { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: #ff7a6b26; font-size: 14px; }
      #hud .bar { display: inline-block; width: 70px; height: 8px; margin-right: 6px; border-radius: 4px;
                  background: #ffffff26; vertical-align: middle; overflow: hidden; }
      #hud .bar span { display: block; height: 100%; }
      /* A small, quick confirmation (e.g. "Perfect"); the sound and rings do the heavy lifting. */
      #flash { position: fixed; top: 72px; left: 0; right: 0; text-align: center; color: #fff; font-size: 18px;
               letter-spacing: 0.04em; text-shadow: 0 1px 4px #000b; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
      #sound { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); display: none;
               padding: 10px 18px; border: 0; border-radius: 999px; cursor: pointer;
               background: #ffd84a; color: #1d2b1f; font-size: 16px; box-shadow: 0 2px 10px #0006; }
      /* Pause overlay: dims the game; title, resume button, and the settings menu. */
      #paused { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
                background: #0a1210a0; color: #fff; font-family: 'Russo One', system-ui, sans-serif; z-index: 5; }
      #paused .title { font-size: 46px; letter-spacing: 0.12em; text-shadow: 0 2px 10px #000c; }
      #paused button { padding: 10px 26px; border: 0; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 18px;
                       background: #ffffffe8; color: #1d2b1f; box-shadow: 0 2px 10px #0006; }
      #paused .hint { font-size: 13px; opacity: 0.8; }
      #paused .menu { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; border-radius: 14px; background: #0d1a14d0; box-shadow: 0 4px 16px #0006; }
      #paused .menu h4 { margin: 0; font-size: 12px; font-weight: 400; letter-spacing: 0.12em; opacity: 0.7; }
      #paused .menu .row { display: flex; gap: 8px; justify-content: center; }
      #paused .menu button { padding: 7px 14px; font-size: 14px; }
      #paused .menu button:hover { background: #fff; }
      #paused .menu .pick { background: #ffffffb0; font-size: 12px; padding: 7px 10px; }
      /* The button a controller or the keyboard has selected. */
      #paused button.focus { outline: 3px solid #ffd84a; outline-offset: 2px; }
      #join .joinSeats { display: grid; grid-template-columns: repeat(2, 200px); gap: 10px; justify-content: center; }
      #join .seat { padding: 10px 12px; border-radius: 10px; border: 2px dashed #ffffff55; text-align: center; font-size: 14px; }
      #join .seat.taken { border-style: solid; border-color: var(--team); background: #ffffff14; }
      #join .seat .who { font-size: 12px; opacity: 0.85; margin-top: 4px; }
      /* Match scoreboard, top center: team blocks with the score, a label in the middle. */
      #scoreboard { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: none; align-items: stretch;
                    border-radius: 10px; overflow: hidden; box-shadow: 0 3px 12px #0006; pointer-events: none;
                    font-family: 'Russo One', system-ui, sans-serif; color: #fff; }
      #scoreboard .team { display: flex; align-items: center; gap: 10px; padding: 4px 14px; font-size: 15px; letter-spacing: 0.06em; }
      #scoreboard .blue { background: #2f6fe8; }
      #scoreboard .red { background: #e8443a; flex-direction: row-reverse; }
      #scoreboard .pts { font-size: 30px; min-width: 1.2em; text-align: center; transition: transform 0.15s; }
      #scoreboard .pts.bump { transform: scale(1.35); }
      #scoreboard .serve { width: 9px; height: 9px; border-radius: 50%; background: #ffe25a; box-shadow: 0 0 6px #ffe25a; visibility: hidden; }
      #scoreboard .serve.on { visibility: visible; }
      #scoreboard .mid { display: flex; align-items: center; padding: 0 14px; background: #1b2330e8; font-size: 12px; letter-spacing: 0.1em; }
      #prompt { position: fixed; top: 84px; left: 0; right: 0; display: none; text-align: center; pointer-events: none;
                color: #fff; font-size: 30px; text-shadow: 0 2px 8px #000c; }
      #prompt small { font-size: 0.6em; opacity: 0.85; }
      #prompt b { display: inline-block; min-width: 1.4em; padding: 0 0.3em; border-radius: 999px; background: #3fbf5f; }
      #credit { position: fixed; top: 12px; right: 16px; font-size: 11px; color: #fffb; text-shadow: 0 1px 2px #000a; }
      #credit a { color: inherit; }
      /* The pause button, alone in the top right; all settings live in the pause menu. */
      #pause { position: fixed; top: 34px; right: 16px; padding: 7px 13px; border: 0; border-radius: 999px; cursor: pointer;
               background: #ffffffe0; color: #1d2b1f; font-family: 'Russo One', system-ui, sans-serif; font-size: 14px;
               box-shadow: 0 2px 8px #0005; }
      #pause:hover { background: #fff; }
      /* Touches used by the team with the ball, under the scoreboard. */
      #touches { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 6px;
                 padding: 4px 12px; border-radius: 999px; background: #1b2330c8; color: #fff; pointer-events: none;
                 font-family: 'Russo One', system-ui, sans-serif; font-size: 12px; letter-spacing: 0.08em; }
      #touches .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #ffffffb0; box-sizing: border-box; }
      #touches .dot.used { background: var(--team); border-color: var(--team); }
      #touches .dot.last { border-color: #ffb03a; box-shadow: 0 0 6px #ffb03a; }
      /* Why the last point ended: a quiet line near the bottom. */
      #reason { position: fixed; bottom: 34px; left: 0; right: 0; text-align: center; color: #fff; font-size: 15px;
                font-family: 'Russo One', system-ui, sans-serif; letter-spacing: 0.03em; text-shadow: 0 1px 3px #000c;
                pointer-events: none; opacity: 0; transition: opacity 0.4s; }
      #help { position: fixed; bottom: 10px; left: 16px; right: 16px; color: #fffd; font-size: 13px; text-shadow: 0 1px 2px #000a; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud">
      <div class="stats"></div>
      <div class="panel"><button id="closeStats" title="Hide stats (I shows them again)">×</button><div class="last"></div></div>
    </div>
    <div id="flash"></div>
    <div id="help"></div>
    <div id="prompt"></div>
    <div id="paused">
      <div class="title">PAUSED</div>
      <button id="resume">▶ Resume</button>
      <div class="menu">
        <h4>GAME</h4>
        <div class="row">
          <button id="mode">🏆 Match (to 11)</button>
          <button id="format">👥 2v2</button>
          <button id="statsToggle">📊 Show stats</button>
        </div>
        <h4>PLAYERS · character ▸ and who plays</h4>
        <div class="seatRow row"><button class="pick" id="pick0"></button><button id="seat0"></button></div>
        <div class="seatRow row"><button class="pick" id="pick1"></button><button id="seat1"></button></div>
        <div class="seatRow row"><button class="pick" id="pick2"></button><button id="seat2"></button></div>
        <div class="seatRow row"><button class="pick" id="pick3"></button><button id="seat3"></button></div>
        <div class="row"><button id="openJoin">🎮 Join with controllers / keyboard</button></div>
      </div>
      <div class="menu" id="join" style="display: none">
        <h4>JOIN · press A (or J / ,) to join · ◀ ▶ to switch seats · B (or K / .) to leave</h4>
        <div class="joinSeats"></div>
        <div class="row"><button id="closeJoin">✔ Done</button></div>
      </div>
      <div class="hint">Stick / d-pad / arrows to move · A to select · B or Esc / P / Menu to resume</div>
    </div>
    <div id="scoreboard">
      <div class="team blue"><span class="serve"></span><span class="name">BLUE</span><span class="pts">0</span></div>
      <div class="mid">FIRST TO 11</div>
      <div class="team red"><span class="serve"></span><span class="name">RED</span><span class="pts">0</span></div>
    </div>
    <div id="touches"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div id="reason"></div>
    <div id="credit">
      Music: "Stage 1" from
      <a href="https://opengameart.org/content/4-chiptunes-adventure" target="_blank" rel="noopener">Chiptune Adventures</a>
      by Juhani Junkala (CC0)
    </div>
    <button id="pause">⏸ Pause</button>
    <button id="sound">🔇 Click here to turn on sound</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
