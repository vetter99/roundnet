<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roundnet</title>
    <!-- Bold sporty display font for game text (the dev panel keeps the system font). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2b1f; font-family: system-ui, sans-serif; }
      #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #hud { position: fixed; top: 12px; left: 16px; color: #fff; text-shadow: 0 1px 3px #000a; pointer-events: none; }
      /* Game text uses the sporty display font. */
      #hud .stats, #flash, #prompt, #sound { font-family: 'Russo One', system-ui, sans-serif; font-weight: 400; letter-spacing: 0.02em; }
      #hud .stats { font-size: 22px; }
      /* Dev stats panel */
      #hud .last { width: 340px; margin-top: 8px; padding: 12px 14px; border-radius: 10px;
                   background: rgba(12, 22, 14, 0.78); text-shadow: none;
                   font-size: 15px; line-height: 1.55; font-variant-numeric: tabular-nums; }
      #hud .section + .section, #hud .miss + .section { margin-top: 12px; }
      #hud .section h4 { margin: 0 0 4px; padding-bottom: 3px; border-bottom: 1px solid #ffffff26;
                         font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.65; }
      #hud .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      #hud .row .k { opacity: 0.8; }
      #hud .row .v { font-weight: 600; text-align: right; }
      #hud .row small { opacity: 0.7; font-size: 12px; }
      #hud .empty { opacity: 0.6; }
      #hud .miss { margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: #ff7a6b26; font-size: 14px; }
      #hud .bar { display: inline-block; width: 70px; height: 8px; margin-right: 6px; border-radius: 4px;
                  background: #ffffff26; vertical-align: middle; overflow: hidden; }
      #hud .bar span { display: block; height: 100%; }
      /* A small, quick confirmation (e.g. "Perfect"); the sound and rings do the heavy lifting. */
      #flash { position: fixed; top: 72px; left: 0; right: 0; text-align: center; color: #fff; font-size: 18px;
               letter-spacing: 0.04em; text-shadow: 0 1px 4px #000b; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
      #sound { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: none;
               padding: 10px 18px; border: 0; border-radius: 999px; cursor: pointer;
               background: #ffd84a; color: #1d2b1f; font-size: 16px; box-shadow: 0 2px 10px #0006; }
      #prompt { position: fixed; bottom: 18%; left: 0; right: 0; display: none; text-align: center; pointer-events: none;
                color: #fff; font-size: 30px; text-shadow: 0 2px 8px #000c; }
      #prompt b { display: inline-block; min-width: 1.4em; padding: 0 0.3em; border-radius: 999px; background: #3fbf5f; }
      #credit { position: fixed; top: 12px; right: 16px; font-size: 11px; color: #fffb; text-shadow: 0 1px 2px #000a; }
      #credit a { color: inherit; }
      #twoPlayer { position: fixed; top: 34px; right: 16px; padding: 8px 14px; border: 0; border-radius: 999px; cursor: pointer;
                   background: #ffffffe0; color: #1d2b1f; font-family: 'Russo One', system-ui, sans-serif; font-size: 14px;
                   box-shadow: 0 2px 8px #0005; }
      #twoPlayer:hover { background: #fff; }
      #help { position: fixed; bottom: 10px; left: 16px; right: 16px; color: #fffd; font-size: 13px; text-shadow: 0 1px 2px #000a; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud"><div class="stats"></div><div class="last"></div></div>
    <div id="flash"></div>
    <div id="help"></div>
    <div id="prompt"></div>
    <div id="credit">
      Music: "Stage 1" from
      <a href="https://opengameart.org/content/4-chiptunes-adventure" target="_blank" rel="noopener">Chiptune Adventures</a>
      by Juhani Junkala (CC0)
    </div>
    <button id="twoPlayer">👥 2 Player</button>
    <button id="sound">🔇 Click here to turn on sound</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
